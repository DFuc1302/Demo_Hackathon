[project]
name = "ai-security-demo-backend"
version = "0.2.0"
description = "Minimal AI security demo backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "scikit-learn>=1.3,<2",
    "uvicorn>=0.30,<1",
    "torch>=2.2,<3",
    "transformers>=4.45,<5",
    "datasets>=2.20,<4",
    "accelerate>=0.34,<2",
    "sentencepiece>=0.2,<1",
    "safetensors>=0.4,<1",
    "pyyaml>=6,<7",
    "protobuf>=4,<8",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
