[project]
name = "ai-security-demo-backend"
version = "0.1.0"
description = "Minimal AI security demo backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "joblib>=1.3,<2",
    "scikit-learn>=1.3,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
