[project]
name = "ai-security-demo-backend"
version = "0.1.0"
description = "Minimal AI security demo backend"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3,<2",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
